<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dagger.svg" />
    <!-- viewport-fit=cover is what makes the portal's env(safe-area-inset-*)
         padding resolve to real values behind the notch and home indicator.
         maximum-scale/user-scalable stop a double-tap on a stat block from
         zooming the whole sheet, which reads as a bug inside a native shell. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0a14" />
    <title>Lorelich</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Only the families the portal actually renders. The web app's six-family
         request pulls in faces that exist solely for GM tooling. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile.jsx"></script>
  </body>
</html>
